<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | JobNest</title>
    <meta name="description" content="Login to your JobNest account." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="login">
    <header class="header">
      <nav class="navbar container">
        <a href="index.html" class="brand" aria-label="JobNest home">
          <span class="brand-mark">JN</span>
          <span>JobNest</span>
        </a>
      </nav>
    </header>

    <main>
      <div class="container">
        <div class="auth-card">
          <div class="auth-header">
            <h2>Welcome Back</h2>
            <a class="small-link" href="register.html">Create account</a>
          </div>

          <form id="loginForm">
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input class="input" id="loginEmail" type="email" placeholder="Enter your email" required />
            </div>
            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input class="input" id="loginPassword" type="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            <div id="loginMessage" class="form-message"></div>
          </form>
        </div>
      </div>
    </main>

    <script src="js/jobs.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
